<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name-Protected Cheese Geography</title>
<link rel="icon" type="image/png" href="favicon.ico">
<link rel="stylesheet" href="resources/leaflet/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --soft: #6e6e6e;
    --faint: #b3b3b3;
    --line: #ececec;
    --wine: #7a1d2e;
    --cheese: #a78230;
    --correct: #3a6f24;
    --close: #b78214;
    --wrong: #9a3322;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    font-family: 'Noto Serif', 'Times New Roman', serif;
    background: var(--bg);
    color: var(--ink);
    font-weight: 400;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    height: 100vh;
    padding: 18px 24px;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 28px;
    position: relative;
  }
  
  #quiz {
    flex: 0 0 clamp(357px, 33vw, 560px);
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  #quiz::-webkit-scrollbar { width: 6px; }
  #quiz::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 3px;
  }

  header { flex: 0 0 auto; }
  header h1 {
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.005em;
    line-height: 1.2;
  }
  header p {
    margin: 0;
    color: var(--soft);
    font-size: 15px;
    line-height: 1.4;
  }

  .info-spacer { flex: 1 1 auto; min-height: 8px; }

  .map-toolbar select {
    font: inherit;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--line);
    padding: 2px 20px 3px 4px;
    cursor: pointer;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23777' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 4px center;
    transition: border-color 0.18s ease;
  }
  .map-toolbar select:hover { border-bottom-color: var(--soft); }
  .map-toolbar select:focus {
    outline: none;
    border-bottom-color: var(--ink);
  }

  .progress {
    flex: 0 0 auto;
    height: 2px;
    background: var(--line);
    overflow: hidden;
  }

  @property --scorePercent {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 0%;
  }

  @property --progressPercent {
    syntax: '<percentage>';
    inherits: false;
    initial-value: 0%;
  }
  .progress-fill {
  width: 100%;
  height: 100%;
  transition: --scorePercent 0.4s ease, --progressPercent 0.4s ease, width 0.4s ease;
  background-image: linear-gradient(
      to right,
      var(--cheese) 0%, var(--cheese) var(--scorePercent),
      var(--faint) var(--scorePercent), var(--faint) var(--progressPercent),
      var(--bg) var(--progressPercent), var(--bg) 100%
    );
  }

  .prompt {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .prompt .badge {
    display: inline-block;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 500;
    color: var(--cheese);
    white-space: nowrap;
  }
  .prompt .badge.pgi { color: var(--cheese); }
  .prompt .badge.tsg { color: var(--cheese); }
  .prompt h2 {
    margin: 0;
    font-size: 29px;
    font-weight: 400;
    letter-spacing: -0.022em;
    line-height: 1.15;
  }
  .prompt .hint {
    margin: 4px 0 0;
    color: var(--soft);
    font-size: 15px;
    line-height: 1.45;
  }
  .prompt .hint:empty { display: none; }

  .map-area {
    flex: 1 1 0;
    height: 100%;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .map-toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 2px 6px;
    font-size: 15px;
    color: var(--soft);
  }
  .map-toolbar .region-picker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .map-toolbar .status-inline {
    font-size: 13px;
    color: var(--soft);
    letter-spacing: 0.12em;
  }
  .map-toolbar .sep {
    display: inline-block;
    width: 3px; height: 3px;
    background: var(--faint);
    border-radius: 50%;
    margin: 0 9px 1px;
    vertical-align: middle;
  }
  #map {
    flex: 1;
    min-height: 0;
    background: #f4f6f7;
    border: 1px solid var(--line);
    border-radius: 2px;
  }

  .leaflet-container,
  .leaflet-container .leaflet-grab { cursor: crosshair; }
  .leaflet-container.leaflet-dragging,
  .leaflet-container.leaflet-dragging .leaflet-grab { cursor: grabbing; }
  .leaflet-container.answered,
  .leaflet-container.answered .leaflet-grab { cursor: default; }

  .leaflet-tooltip.reveal-label {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.005em;
    white-space: nowrap;
    text-shadow: 0 0 3px white, 0 0 3px white, 0 0 3px white, 0 0 3px white;
  }
  .leaflet-tooltip.reveal-label::before { display: none !important; }

  .leaflet-tooltip.guess-verdict-label {
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    text-shadow: 0 0 3px white, 0 0 3px white, 0 0 3px white, 0 0 3px white;
  }
  .leaflet-tooltip.guess-verdict-label.perfect { color: var(--correct); }
  .leaflet-tooltip.guess-verdict-label.close { color: var(--close); }
  .leaflet-tooltip.guess-verdict-label.far { color: var(--wrong); }
  .leaflet-tooltip.guess-verdict-label::before { display: none !important; }

  .continue-hint {
    position: absolute;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink);
    white-space: nowrap;
    pointer-events: none;
    z-index: 600;
    opacity: 0;
    transition: opacity 0.18s ease;
    text-shadow: 0 0 3px white, 0 0 3px white, 0 0 3px white, 0 0 3px white;
  }
  .continue-hint.visible { opacity: 1; }

  .leaflet-control-layers,
  .leaflet-bar {
    border: 1px solid var(--line) !important;
    box-shadow: none !important;
    border-radius: 2px !important;
  }
  .leaflet-bar a {
    border-bottom-color: var(--line) !important;
  }
  
  .leaflet-control-attribution {
    font-size: 10px;
    background: rgba(255, 255, 255, 0.78) !important;
  }

  .feedback {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .feedback .placeholder {
    margin: 0;
    color: var(--ink);
    font-size: 15px;
    font-style: italic;
  }
  .feedback .verdict-block {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .feedback .verdict {
    font-weight: 500;
    font-size: 14px;
  }
  .feedback .verdict.perfect { color: var(--correct); }
  .feedback .verdict.close { color: var(--close); }
  .feedback .verdict.far { color: var(--wrong); }
  .feedback .dist {
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .feedback .info {
    padding-top: 0;
  }
  .feedback .cheese-head {
    margin: 0 0 10px;
  }
  .feedback .pronunciation {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--soft);
    line-height: 1.35;
  }
  .feedback .pronunciation .respelling {

    letter-spacing: 0.01em;
  }
  .feedback .pronunciation .sep {

    margin: 0 6px;
  }
  .feedback .pronunciation .ipa {

  }
  .feedback .cheese-where {
    margin: 5px 0 0;
    font-size: 14px;
    color: var(--soft);
    line-height: 1.35;
  }
  .feedback .cheese-where strong {

    font-weight: 500;

    display: block;
    width: 100%;

    background: var(--line);

    inset: 0;
    background: rgba(0, 0, 0, 0.88);

    align-items: center;
    justify-content: center;

    cursor: zoom-out;
    opacity: 0;
    transition: opacity 120ms ease-out;
  }
  #lightbox.open { display: flex; opacity: 1; }
  #lightbox-img {
    max-width: 92vw;
    max-height: 92vh;
    object-fit: contain;
    cursor: default;
    user-select: none;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  .lightbox-btn {
    position: absolute;
    background: transparent;
    border: 0;
    color: rgba(255, 255, 255, 0.55);
    cursor: pointer;
    padding: 6px 12px;
    font-family: inherit;
    line-height: 1;
    transition: color 120ms ease-out;
  }
  .lightbox-btn:hover, .lightbox-btn:focus-visible { color: #fff; outline: none; }
  #lightbox-close {
    top: 14px;
    right: 18px;
    font-size: 28px;
  }
  #lightbox-prev, #lightbox-next {
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    padding: 12px 18px;
  }
  #lightbox-prev { left: 12px; }
  #lightbox-next { right: 12px; }
  #lightbox.single #lightbox-prev,
  #lightbox.single #lightbox-next { display: none; }
  .feedback .facts {
    display: grid;
    grid-template-columns: 78px 1fr;
    column-gap: 12px;
    row-gap: 5px;
    margin: 0 0 14px;
    padding: 0;
    font-size: 14px;
  }
  .feedback .facts dt {
    margin: 0;
    padding-top: 2px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--soft);
  }
  .feedback .facts dd {
    margin: 0;
    color: var(--ink);
    line-height: 1.4;
  }
  .feedback .desc {
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    margin: 0 0 14px;
  }
  .feedback .sources {
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .feedback .sources-label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 5px;
  }
  .feedback .sources ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .feedback .sources li {
    margin: 0;
    padding: 2px 0;
    font-size: 13px;
    line-height: 1.35;
  }
  .feedback .sources a {
    color: var(--soft);
    text-decoration: none;
    border-bottom: 1px dotted var(--line);
    padding-bottom: 1px;
    transition: color 0.15s ease, border-color 0.15s ease;

  .feedback .sources a:hover {
    color: var(--ink);
    border-bottom-color: var(--soft);
  }
  .feedback .actions {

    justify-content: flex-end;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);

  .btn {
    padding: 8px 22px;
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 999px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.18s ease, color 0.18s ease;

  .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    letter-spacing: 0.14em;

  }

  .result-board-label {

    letter-spacing: 0.12em;

  .result-board ol {

  }
  .result-board li {

    justify-content: space-between;

    gap: 12px;

    font-size: 14px;

  .credit {

    font-size: 11px;

    letter-spacing: 0.02em;
    text-align: left;

  .credit a:hover { text-decoration-color: var(--faint); }

  @media (max-width: 820px) {
    html, body { height: auto; }
    body { height: auto; overflow: visible; }
    .app {
      flex-direction: column;
      padding: 12px 16px;
      gap: 10px;
      max-width: 100%;
      height: auto;
      min-height: 100vh;
    }
    #quiz {
      display: contents;
    }
    .map-area {
      flex: 0 0 auto;
      height: 55vh;
      min-height: 320px;
    }
    .prompt { order: 1; }
    .feedback { min-height: 0; order: 2; }
    .info-spacer { display: none; }
    .prompt h2 { font-size: 23px; }
    .result .score-big { font-size: 48px; }
    .btn {
      padding: 12px 28px;
      min-height: 44px;
      font-size: 14px;
    }
    .map-toolbar select {
      font-size: 16px;
      padding: 8px 24px 8px 6px;
    }
  }

  select {
  font-family: 'Noto Serif', 'Times New Roman', serif;
  }

  option {
  font-family: 'Noto Serif', 'Times New Roman', serif;
  }

<body>
  <div class="app">
    <aside id="quiz">
      <header>
        <h1>Name-Protected Cheese Geography</h1>
        <p>Select where the cheese is from on the map.</p>
      </header>

      <div class="prompt">
        <span class="badge" id="type-badge">PDO</span>
        <h2 id="region-name">—</h2>
        <p class="hint" id="region-hint"></p>
      </div>

      <div class="feedback" id="feedback">
        <p class="placeholder" id="feedback-placeholder">Click the map to place your guess.</p>
        <div class="info" id="feedback-info" hidden>
          <div class="cheese-head">
            <p class="pronunciation" id="info-pronunciation" hidden><span class="respelling" id="info-respelling"></span><span class="sep" id="info-pron-sep">·</span><span class="ipa" id="info-ipa"></span></p>
            <p class="cheese-where"><strong id="info-country"></strong><span id="info-where-sep"> · </span><span id="info-where"></span></p>
          </div>
          <img class="cheese-img" id="cheese-img" alt="" hidden onerror="this.hidden=true">
          <dl class="facts" id="info-facts"></dl>
          <p class="desc" id="info-desc"></p>
          <div class="sources" id="info-sources" hidden>
            <span class="sources-label">Links</span>
            <ul id="sources-list"></ul>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="next-btn" hidden>Next</button>
        </div>
      </div>

      <div class="info-spacer"></div>
    </aside>

    <main class="map-area">
      <div class="map-toolbar">
        <label class="region-picker">
          <select id="list-select" aria-label="Cheese list filter"></select>
        </label>
        <span class="status-inline" style="text-align: right;">
          <span id="round-counter">1 / 10</span>
          <br>
          <span id="score-counter" >0 pts</span>
        </span>
      </div>
      <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
      <div id="map"></div>
      <div id="continue-hint" class="continue-hint" aria-hidden="true">Tap or press space to continue...</div>
    </main>

    <div id="result" class="result hidden">
      <p class="result-label">Final score</p>
      <div class="score-big" id="final-score">0</div>
      <button class="btn" id="restart-btn">Play Again</button>
      <div class="result-board" id="result-board" hidden>
        <p class="result-board-label">Previous rounds this session</p>
        <ol id="result-board-list"></ol>
      </div>
    </div>
  </div>

  <div id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="lightbox-btn" id="lightbox-prev" type="button" aria-label="Previous image">&#x2039;</button>
    <img id="lightbox-img" alt="">
    <button class="lightbox-btn" id="lightbox-next" type="button" aria-label="Next image">&#x203A;</button>
    <button class="lightbox-btn" id="lightbox-close" type="button" aria-label="Close">&times;</button>
  </div>

<script src="resources/leaflet/leaflet.js"></script>
<script src="resources/cheeses.js"></script>
<script>
if (!Array.isArray(window.CHEESES_DATA)) {
  throw new Error('CHEESES_DATA not loaded. Make sure resources/cheeses.js is reachable.');
}
const REGIONS = window.CHEESES_DATA;

const TARGET_RADIUS_M = 40000;

function pointInRing(lng, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) &&
        (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

function pointInPolygonGeom(lng, lat, geom) {
  if (!geom) return false;
  if (geom.type === "Polygon") return pointInRing(lng, lat, geom.coordinates[0]);
  if (geom.type === "MultiPolygon") {
    return geom.coordinates.some(poly => pointInRing(lng, lat, poly[0]));
  }
  return false;
}

function distanceToSegmentMeters(p, ax, ay, bx, by) {
  const M_PER_DEG_LAT = 111320;
  const cosLat = Math.cos(p.lat * Math.PI / 180);
  const Ax = (ax - p.lng) * M_PER_DEG_LAT * cosLat;
  const Ay = (ay - p.lat) * M_PER_DEG_LAT;
  const Bx = (bx - p.lng) * M_PER_DEG_LAT * cosLat;
  const By = (by - p.lat) * M_PER_DEG_LAT;
  const dx = Bx - Ax, dy = By - Ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 === 0 ? 0 : -(Ax * dx + Ay * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = Ax + t * dx, cy = Ay + t * dy;
  return Math.hypot(cx, cy);
}

function distanceToPolygonMeters(latLng, geom) {
  const rings = geom.type === "Polygon" ? [geom.coordinates[0]] :
                geom.type === "MultiPolygon" ? geom.coordinates.map(p => p[0]) :
                [];
  let min = Infinity;
  for (const ring of rings) {
    for (let i = 0; i < ring.length - 1; i++) {
      const a = ring[i], b = ring[i + 1];
      const d = distanceToSegmentMeters(latLng, a[0], a[1], b[0], b[1]);
      if (d < min) min = d;
    }
  }
  return min;
}

function scoringDistanceMeters(guess, target, region) {
  if (region) {
    if (pointInPolygonGeom(guess.lng, guess.lat, region)) return 0;
    return distanceToPolygonMeters(guess, region);
  }
  return Math.max(0, guess.distanceTo(target) - TARGET_RADIUS_M);
}

function scoreFor(distKm, inside) {
  if (inside)        return { pts: 1000, label: "Bullseye!", cls: "perfect" };
  if (distKm <= 10)  return { pts: 1000, label: "Close enough.", cls: "perfect" };
  if (distKm <= 50)  return { pts: Math.round(10*(100 - distKm*0.4)), label: "Very close.", cls: "close" };
  if (distKm <= 200) return { pts: Math.round(10*(80 - (distKm-50)*0.2)), label: "In the neighborhood.", cls: "close" };
  if (distKm <= 500) return { pts: Math.max(0, Math.round(10*(30 - (distKm-200)*0.1))), label: "Far afield.", cls: "far" };
  return { pts: 0, label: "Way off.", cls: "far" };
}

function updateProgressBar() {

  const scorePercent = (score / (1000 * order.length)) * 100
  const progressPercent = (current / order.length) * 100
  const progressFill = document.querySelector('.progress-fill')

  progressFill.style.setProperty('--progressPercent', `${progressPercent}%`);
  progressFill.style.setProperty('--scorePercent', `${scorePercent}%`);
}

const QUIZ_SIZE = 10;
const $ = (id) => document.getElementById(id);
const listSelect = $("list-select");
const CURATED_LISTS = window.CHEESES_LISTS || [];

let order = [];
let current = 0;
let score = 0;
let answered = false;
let currentImages = [];

function imagesFor(r) {
  if (Array.isArray(r.images) && r.images.length) return r.images;
  if (r.image) return [r.image];
  return [];
}

let selectedList = null;

const tileLayers = {
  "Topographical": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community',
    maxZoom: 19
  }),
  "Satellite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, GIS Community',
    maxZoom: 19,
  })
};

const map = L.map('map', {
  attributionControl: false, /*Mea culpa, cartographi!*/
  center: [52, 10],
  zoom: 4,
  minZoom: 3,
  worldCopyJump: false,
  zoomControl: true,
  layers: [tileLayers.Topographical],
});

L.control.layers(tileLayers, null, { position: 'topright', collapsed: true }).addTo(map);

const revealLayer = L.featureGroup().addTo(map);

function populateListSelect() {
  const parts = [];

  if (CURATED_LISTS.length) {
    parts.push(`<optgroup label="Curated">`);
    for (const lst of CURATED_LISTS) {
      parts.push(`<option value="curated:${lst.id}">${lst.label} (${lst.members.length})</option>`);
    }
    parts.push(`</optgroup>`);
  }

  const counts = REGIONS.reduce((m, r) => (m[r.country] = (m[r.country] || 0) + 1, m), {});
  const countries = Object.keys(counts).sort((a, b) => a.localeCompare(b));
  parts.push(`<optgroup label="Geographic">`);
  parts.push(`<option value="all">All of Europe (${REGIONS.length})</option>`);
  for (const c of countries) parts.push(`<option value="country:${c}">${c} (${counts[c]})</option>`);
  parts.push(`</optgroup>`);

  listSelect.innerHTML = parts.join("");
}

function resolveSelection(value) {
  if (value.startsWith("curated:")) {
    const id = value.slice("curated:".length);
    const lst = CURATED_LISTS.find(l => l.id === id);
    const members = new Set(lst.members);
    const pool = REGIONS.filter(r => members.has(r.name));
    return { kind: "curated", label: lst.label, pool, zoom: lst.zoom || null };
  }
  if (value.startsWith("country:")) {
    const country = value.slice("country:".length);
    return { kind: "country", label: country, pool: REGIONS.filter(r => r.country === country), zoom: null };
  }
  return { kind: "all", label: "All of Europe", pool: REGIONS, zoom: null };
}

function applyZoom() {
  if (selectedList.zoom) {
    map.setView(selectedList.zoom.center, selectedList.zoom.zoom);
    return;
  }
  if (selectedList.kind !== "country") {
    map.setView([52, 10], 4);
    return;
  }
  const pool = selectedList.pool;
  if (pool.length === 1) {
    map.setView([pool[0].lat, pool[0].lon], 7);
  } else {
    const bounds = L.latLngBounds(pool.map(r => [r.lat, r.lon]));
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 8 });
  }
}

function shuffle(a) {
  a = [...a];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  applyZoom();
  const pool = selectedList.pool;
  order = shuffle(pool).slice(0, Math.min(QUIZ_SIZE, pool.length));
  current = 0;
  score = 0;
  answered = false;
  $("quiz").style.display = "";
  $("result").classList.add("hidden");
  render();
}

function render() {
  const r = order[current];
  $("round-counter").textContent = `${current + 1} / ${order.length}`;
  $("score-counter").textContent = `${score} pts`;
  
  updateProgressBar()

  const badge = $("type-badge");
  const protections = r.name_protections || [];
  const parts = [];
  if (r.producer) parts.push(r.producer);
  if (protections.length) parts.push(protections.join(" / "));
  badge.textContent = parts.join(" · ");
  if (protections.length) {
    badge.className = `badge ${protections[0].toLowerCase()}`;
  } else if (r.producer) {
    badge.className = "badge brand";
  } else {
    badge.className = "badge";
  }
  $("region-name").textContent = r.name;
  $("region-hint").textContent = "";

  revealLayer.clearLayers();
  $("feedback-placeholder").hidden = false;
  $("feedback-info").hidden = true;
  $("next-btn").hidden = true;
  map.getContainer().classList.remove("answered");
  $("continue-hint").classList.remove("visible");
  answered = false;

  const imgEl = $("cheese-img");
  imgEl.hidden = true;
  imgEl.removeAttribute("src");
  for (const fname of imagesFor(r)) {
    const preload = new Image();
    preload.src = "resources/" + fname;
  }
}

function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

const PAST_LABELS = {
  raw: "Raw",
  pasteurized: "Pasteurized",
  thermised: "Thermised",
  any: "Raw or pasteurized",
};

function fmtAgeing(d) {
  if (d == null) return null;
  if (d === 0) return "Fresh — no ageing";
  if (d < 60) return `${d}+ ${d === 1 ? "day" : "days"}`;
  if (d < 365) {
    const m = Math.round(d / 30);
    return `${m}+ ${m === 1 ? "month" : "months"}`;
  }
  const y = Math.round(d / 365 * 10) / 10;
  return `${y}+ ${y === 1 ? "year" : "years"}`;
}

function buildFacts(r) {
  const rows = [];

  const milks = (r.milk_types || []).map(cap).join(", ");
  const past = r.pasteurization ? PAST_LABELS[r.pasteurization] : "";
  if (milks || past) {
    rows.push(["Milk", [milks, past].filter(Boolean).join(" · ")]);
  }

  if (r.style && r.style.length) rows.push(["Style", r.style.join(", ")]);

  const age = fmtAgeing(r.ageing_min_days);
  if (age) rows.push(["Ageing", age]);

  if (r.format) rows.push(["Format", r.format]);

  if (r.animal_breed && r.animal_breed.length) {
    rows.push(["Breed", r.animal_breed.join(", ")]);
  }

  if (r.year_recognized) rows.push(["Since", String(r.year_recognized)]);

  if (r.vegetarian === true) rows.push(["Rennet", "Vegetable (vegetarian)"]);
  else if (r.vegetarian === false) rows.push(["Rennet", "Animal"]);

  return rows;
}

function renderFacts(r) {
  const dl = $("info-facts");
  dl.innerHTML = "";
  for (const [label, value] of buildFacts(r)) {
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = value;
    dl.appendChild(dt);
    dl.appendChild(dd);
  }
  dl.hidden = dl.children.length === 0;
}

function renderSources(r) {
  const wrap = $("info-sources");
  const list = $("sources-list");
  list.innerHTML = "";

  let items = Array.isArray(r.sources) ? r.sources : [];

  if (!items.length) {
    wrap.hidden = true;
    return;
  }

  for (const s of items) {
    const li = document.createElement("li");

    if (s.url) {
      const a = document.createElement("a");
      a.href = s.url;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = s.label || s.url;
      li.appendChild(a);
    } else {
      li.textContent = s.label || "";
    }

    list.appendChild(li);
  }

  wrap.hidden = false;
}

function handleClick(e) {
  if (answered) { next(); return; }
  answered = true;
  const r = order[current];
  const guess = e.latlng;
  const target = L.latLng(r.lat, r.lon);
  const distM = scoringDistanceMeters(guess, target, r.region_polygon);
  const insideRegion = distM === 0;
  const distKm = Math.round(distM / 1000);
  const { pts, label, cls } = scoreFor(distKm, insideRegion);
  score += pts;

  const distLine = insideRegion
    ? ""
    : distKm < 1 ? "<1 km off" : `~${distKm.toLocaleString()} km off`;
  const verdict = distLine ? `${label} +${pts} pts · ${distLine}` : `${label} +${pts} pts`;
  drawReveal(guess, target, r, verdict, cls);
  const pron = r.pronunciation || {};
  if (pron.respelling || pron.ipa) {
    $("info-respelling").textContent = pron.respelling || "";
    $("info-ipa").textContent = pron.ipa || "";
    $("info-pron-sep").hidden = !(pron.respelling && pron.ipa);
    $("info-pronunciation").hidden = false;
  } else {
    $("info-pronunciation").hidden = true;
  }
  $("info-country").textContent = r.country;
  $("info-where").textContent = r.where || "";
  $("info-where-sep").hidden = !r.where;
  $("info-desc").textContent = r.desc_long || r.desc || "";

  current++;
  updateProgressBar()
  renderFacts(r);
  renderSources(r);

  const imgEl = $("cheese-img");
  currentImages = imagesFor(r);
  if (currentImages.length) {
    imgEl.src = "resources/" + currentImages[0];
    imgEl.alt = r.name;
    imgEl.hidden = false;
  } else {
    imgEl.removeAttribute("src");
    imgEl.hidden = true;
  }
  $("feedback-placeholder").hidden = true;
  $("feedback-info").hidden = false;
  $("next-btn").hidden = false;
  map.getContainer().classList.add("answered");
  $("continue-hint").classList.add("visible");
  $("score-counter").textContent = `${score} pts`;
  $("next-btn").textContent = current === order.length - 1 ? "See Results" : "Next";

  if (!window.matchMedia("(max-width: 820px)").matches) {
    $("next-btn").focus({ preventScroll: true });
  }
}

function drawReveal(guess, target, r, verdictText, verdictCls) {
  if (r.region_polygon) {
    L.geoJSON(r.region_polygon, {
      style: {
        color: '#ffffff', weight: 5, opacity: 0.85,
        fill: false, interactive: false,
      },
    }).addTo(revealLayer);
    L.geoJSON(r.region_polygon, {
      style: {
        color: '#3a6f24', weight: 1.8, opacity: 0.95,
        fillColor: '#3a6f24', fillOpacity: 0.2,
        interactive: false,
      },
    }).addTo(revealLayer);
  }

  L.polyline([guess, target], {
    color: '#ffffff', weight: 4, opacity: 0.7, interactive: false,
  }).addTo(revealLayer);
  L.polyline([guess, target], {
    color: '#4a4944', weight: 1.5, dashArray: '5 3', opacity: 0.95, interactive: false,
  }).addTo(revealLayer);

  if (!r.region_polygon) {
    L.circle(target, {
      radius: TARGET_RADIUS_M,
      color: '#ffffff', weight: 5, opacity: 0.85,
      fill: false, interactive: false,
    }).addTo(revealLayer);
    L.circle(target, {
      radius: TARGET_RADIUS_M,
      color: '#3a6f24', weight: 1.8, opacity: 0.95,
      fillColor: '#3a6f24', fillOpacity: 0.2,
      interactive: false,
    }).addTo(revealLayer);
  }
  
  L.circleMarker(target, {
    radius: 6, color: '#ffffff', weight: 1.5,
    fillColor: '#3a6f24', fillOpacity: 1, interactive: false,
  })
    .bindTooltip(r.name, {
      permanent: true, direction: 'right', offset: [10, -2], className: 'reveal-label',
    })
    .addTo(revealLayer);
  
  L.circleMarker(guess, {
    radius: 6, color: '#ffffff', weight: 1.5,
    fillColor: '#1f1d18', fillOpacity: 1, interactive: false,
  })
    .bindTooltip(verdictText, {
      permanent: true, direction: 'top', offset: [0, -10],
      className: `guess-verdict-label ${verdictCls}`,
    })
    .addTo(revealLayer);
}

function next() {
  /*current++;*/
  if (current >= order.length) showResult();
  else render();

  if (window.matchMedia("(max-width: 820px)").matches) {
    window.scrollTo(0, 0);
  }
}


const SCOREBOARD_KEY = "cheese-map-scoreboard";
const SCOREBOARD_MAX = 20;

function loadScoreboard() {
  try {
    const raw = sessionStorage.getItem(SCOREBOARD_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveScoreboard(list) {
  try { sessionStorage.setItem(SCOREBOARD_KEY, JSON.stringify(list)); }
  catch (e) { /* private mode etc — silently drop */ }
}

function renderScoreboard(list) {
  const wrap = $("result-board");
  const ol = $("result-board-list");
  ol.innerHTML = "";
  if (list.length === 0) { wrap.hidden = true; return; }
  wrap.hidden = false;

  for (let i = list.length - 1; i >= 0; i--) {
    const e = list[i];
    const li = document.createElement("li");
    const country = document.createElement("span");
    country.className = "country";
    country.textContent = e.country;
    const sc = document.createElement("span");
    sc.className = "score";
    sc.textContent = `${e.score}`;
    li.appendChild(country);
    li.appendChild(sc);
    ol.appendChild(li);
  }
}

function showResult() {
  $("quiz").style.display = "none";
  $("result").classList.remove("hidden");
  const max = order.length * 100;
  $("final-score").textContent = `${score}`;

  const previous = loadScoreboard();
  renderScoreboard(previous);

  previous.push({
    score, max,
    country: selectedList.label,
    date: new Date().toISOString(),
  });
  if (previous.length > SCOREBOARD_MAX) previous.shift();
  saveScoreboard(previous);
}


let lightboxIndex = 0;

function openLightbox(idx) {
  if (!currentImages.length) return;
  lightboxIndex = idx;
  const box = $("lightbox");
  box.classList.toggle("single", currentImages.length === 1);
  box.classList.add("open");
  box.setAttribute("aria-hidden", "false");
  setLightboxImage();
}

function closeLightbox() {
  const box = $("lightbox");
  box.classList.remove("open");
  box.setAttribute("aria-hidden", "true");
  $("lightbox-img").removeAttribute("src");
}

function setLightboxImage() {
  $("lightbox-img").src = "resources/" + currentImages[lightboxIndex];
}

function lightboxNav(delta) {
  if (currentImages.length < 2) return;
  lightboxIndex = (lightboxIndex + delta + currentImages.length) % currentImages.length;
  setLightboxImage();
}

$("cheese-img").addEventListener("click", () => openLightbox(0));
$("lightbox").addEventListener("click", (e) => {
  if (e.target.id === "lightbox") closeLightbox();
});
$("lightbox-close").addEventListener("click", closeLightbox);
$("lightbox-prev").addEventListener("click", (e) => { e.stopPropagation(); lightboxNav(-1); });
$("lightbox-next").addEventListener("click", (e) => { e.stopPropagation(); lightboxNav(1); });
document.addEventListener("keydown", (e) => {
  if (!$("lightbox").classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowLeft") lightboxNav(-1);
  else if (e.key === "ArrowRight") lightboxNav(1);
});

map.on("click", handleClick);
$("next-btn").addEventListener("click", next);

document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" && e.key !== " ") return;
  if (!answered) return;
  if ($("lightbox").classList.contains("open")) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === "SELECT" || ae.tagName === "INPUT" || ae.tagName === "TEXTAREA")) return;
  e.preventDefault();
  next();
});
$("restart-btn").addEventListener("click", start);
listSelect.addEventListener("change", () => {
  writeListToUrl(listSelect.value);
  selectedList = resolveSelection(listSelect.value);
  start();
});

function getListFromUrl() {
  const v = new URLSearchParams(window.location.search).get("list");
  if (!v) return null;
  return Array.from(listSelect.options).some(o => o.value === v) ? v : null;
}
function writeListToUrl(value) {
  const url = new URL(window.location.href);
  if (value === "all") url.searchParams.delete("list");
  else url.searchParams.set("list", value);
  history.replaceState(null, "", url);
}

populateListSelect();
const initialList = getListFromUrl() || "all";
listSelect.value = initialList;
selectedList = resolveSelection(initialList);
start();

let _resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => map.invalidateSize(), 150);
});
</script>
